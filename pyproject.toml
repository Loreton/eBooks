[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "eBooks"
version = "0.1.3"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "ebooklib>=0.20",
    "emoji>=2.15.0",
    "pylnlib",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
ebooks = "eBooks.main:main"

[project.license]
text = "MIT"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "E401",
    "E402",
    "E702",
    "E701",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.uv.sources.pylnlib]
path = "../pyLnLib"
editable = true
